<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Outer subtle glow -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#072216" stroke="#20D77A" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Inner border card -->
  <rect x="12" y="12" width="96" height="96" rx="22" fill="#0B2B1D" stroke="#20D77A" stroke-width="2.5"/>
  <!-- Inner shadow line -->
