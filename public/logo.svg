  <!-- Text AG -->
  <text x="60" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#F3F8F4" text-anchor="middle" letter-spacing="1">AG</text>
  <!-- Divider Line -->
  <line x1="36" y1="67" x2="84" y2="67" stroke="#20D77A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Text RIDER -->
  <text x="60" y="83" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#20D77A" text-anchor="middle" letter-spacing="3">RIDER</text>
